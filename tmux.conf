############################################################
# TMUX CONFIGURATION — ~/.config/tmux/tmux.conf
# tmux 3.5a | Prefix: Ctrl-a
#
# ── Quick Reference ────────────────────────────────────────
#
# PREFIX = Ctrl-a  (replaces default Ctrl-b)
#
# ── Core ───────────────────────────────────────────────────
# Ctrl-a r          → Reload this config
# Ctrl-a c          → Create new window
# Ctrl-a ,          → Rename current window
# Ctrl-a &          → Kill current window
# Ctrl-a d          → Detach from session
#
# ── Sessions ───────────────────────────────────────────────
# Ctrl-a C-c        → Create new session
# Ctrl-a S          → Switch session interactively
# Ctrl-a $          → Rename current session
# Ctrl-a X          → Kill current session
#
# ── Pane Splits ────────────────────────────────────────────
# Ctrl-a |          → Split horizontally (side by side)
# Ctrl-a -          → Split vertically (top / bottom)
#
# ── Pane Navigation ───────────────────────────────────────
# Ctrl-a h/j/k/l   → Move between panes (vim-style)
# Ctrl + h/j/k/l   → Move between panes AND nvim splits (seamless)
# Alt  + h/j/k/l   → Same, alternate modifier (no prefix)
# Ctrl-a Ctrl-l    → Clear screen (since Ctrl-l now navigates)
#
# ── Pane Resizing ─────────────────────────────────────────
# Ctrl-a H/J/K/L   → Resize pane by 5 cells (vim-style)
# Ctrl-a m          → Toggle pane zoom (maximize / restore)
#
# ── Pane Management ───────────────────────────────────────
# Ctrl-a x          → Kill current pane (with confirm)
#
# ── Window Navigation ─────────────────────────────────────
# Alt + 1..9        → Jump directly to window 1-9
# Ctrl-a p          → Previous window
# Ctrl-a n          → Next window
# Ctrl-a <          → Swap window left
# Ctrl-a >          → Swap window right
#
# ── Copy Mode (Vim-style) ─────────────────────────────────
# Ctrl-a [          → Enter copy mode
# v                 → Start selection
# Ctrl-v            → Block (rectangle) selection
# y                 → Yank selection & exit copy mode
#
# ── Mouse ──────────────────────────────────────────────────
# Scroll / Click    → Scroll history & select panes/windows
#
############################################################


# ===========================================================
# TERMINAL & COLOR SUPPORT
# ===========================================================

# Use tmux-256color as default terminal type
set -g default-terminal "tmux-256color"

# Clear previous terminal overrides to avoid duplicates
set -gu terminal-overrides 2>/dev/null

# Enable 24-bit (RGB) true color for common terminal emulators
set -as terminal-features "xterm-256color:RGB"
set -as terminal-features "tmux-256color:RGB"
set -as terminal-features "alacritty:RGB"
set -as terminal-features "kitty:RGB"
set -as terminal-features "wezterm:RGB"

# Let escape sequences from apps pass through to kitty
# (needed for kitty graphics protocol, e.g. image previews in nvim)
set -gq allow-passthrough on


# ===========================================================
# MOUSE & CLIPBOARD
# ===========================================================

# Enable mouse support (scroll, click, drag to resize panes)
set -g mouse on

# Allow tmux to set the system clipboard via OSC 52
set -g set-clipboard on


# ===========================================================
# PREFIX KEY
# ===========================================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix


# ===========================================================
# GENERAL OPTIONS
# ===========================================================

# Reduce escape-time so vim/neovim feel responsive
# (default 500ms causes noticeable delay after pressing Escape)
set -g escape-time 10

# Increase scrollback buffer (lines of history per pane)
set -g history-limit 50000

# Enable focus events so editors can detect window focus changes
set -g focus-events on

# Display status messages and pane indicators for 2 seconds
set -g display-time 2000
set -g display-panes-time 2000


# ===========================================================
# WINDOW & PANE INDEXING
# ===========================================================

# Start numbering at 1 (matches keyboard layout: 1 is leftmost)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows automatically when one is closed
set-option -g renumber-windows on


# ===========================================================
# CONFIG RELOAD
# ===========================================================

# Prefix + r → reload this config file and show confirmation
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf \; display-message "Config reloaded!"


# ===========================================================
# PANE SPLITS (keep current working directory)
# ===========================================================

# Prefix + | → horizontal split (side by side)
unbind %
bind | split-window -h -c "#{pane_current_path}"

# Prefix + - → vertical split (top / bottom)
unbind '"'
bind - split-window -v -c "#{pane_current_path}"


# ===========================================================
# PANE NAVIGATION (VIM STYLE)
# ===========================================================

# Prefix + h/j/k/l → move between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ===========================================================
# PANE RESIZING
# ===========================================================

# Prefix + H/J/K/L (uppercase) → resize pane by 5 cells
# Use -r flag so you can press repeatedly without re-pressing prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix + m → toggle pane zoom (maximize / restore)
bind m resize-pane -Z


# ===========================================================
# WINDOW NAVIGATION & MANAGEMENT
# ===========================================================

# Prefix + < / > → swap window position left or right
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# Open new windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"


# ===========================================================
# SESSION MANAGEMENT
# ===========================================================

# Prefix + Ctrl-c → create a new session
bind C-c new-session

# Prefix + S → switch sessions interactively (tree view)
bind S choose-tree -s

# Prefix + X → kill current session (with confirmation)
bind X confirm-before -p "Kill session #S? (y/n)" kill-session


# ===========================================================
# SEAMLESS NVIM <-> TMUX NAVIGATION (vim-tmux-navigator)
# ===========================================================
# If the current pane runs (n)vim, forward the key to it so
# vim-tmux-navigator moves between vim splits; otherwise tmux
# moves between panes. One keybinding, both layers.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# Ctrl + h/j/k/l → navigate panes/splits (vim-aware)
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Alt + h/j/k/l → same thing, alternate modifier (vim-aware)
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Ctrl-l normally clears the shell; that's now "pane right".
# Prefix + Ctrl-l → send a real Ctrl-l (clear screen)
bind C-l send-keys 'C-l'

# Same navigation keys work while in copy mode
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R


# ===========================================================
# ALT KEY SHORTCUTS (no prefix needed)
# ===========================================================

# Alt + number → jump to window 1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# ===========================================================
# COPY MODE (VIM STYLE)
# ===========================================================

# Use vi-style keys in copy mode
set-window-option -g mode-keys vi

# v → begin selection (like vim visual mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Ctrl-v → toggle block/rectangle selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y → yank (copy) selection and exit copy mode
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Disable mouse-drag auto-copy (must explicitly press y to yank)
unbind -T copy-mode-vi MouseDragEnd1Pane


# ===========================================================
# THEME — AURA DRACULA SPIRIT (SOFT)
# ===========================================================
# Exact colors from VS Code "Aura Dracula Spirit (Soft)"
# by JoseMurilloc (github.com/JoseMurilloc/aura-spirit-dracula)
# Unified across kitty + tmux + nvim.
#
# Color palette reference:
#   bg      = #191521    fg      = #edecee
#   purple  = #a277ff    cyan    = #82e2ff
#   pink    = #f694ff    red     = #ff6767
#   green   = #61ffca    orange  = #ffca85
#   comment = #64548E    select  = #3d375e
#   sidebar = #14111b    widget  = #140e1a

thm_bg="#191521"
thm_fg="#edecee"

thm_cyan="#82e2ff"
thm_magenta="#a277ff"
thm_pink="#f694ff"
thm_red="#ff6767"
thm_green="#61ffca"
thm_yellow="#ffca85"
thm_blue="#a277ff"
thm_orange="#ffca85"

thm_black="#14111b"
thm_gray="#2e2b38"
thm_black4="#3b334b"


# ===========================================================
# STATUS BAR
# ===========================================================

# Enable status bar
set -g status on

# Status bar background color
set -g status-bg "${thm_bg}"

# Left-align window list
set -g status-justify left

# Allow long status strings
set -g status-left-length 100
set -g status-right-length 100

# Refresh status bar every 5 seconds (default is 15)
set -g status-interval 5


# ===========================================================
# MESSAGE & COMMAND STYLES
# ===========================================================

# Style for status bar messages (e.g., "Config reloaded!")
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"


# ===========================================================
# PANE BORDER STYLES
# ===========================================================

# Inactive pane border: subtle gray
set -g pane-border-style "fg=${thm_gray}"

# Active pane border: highlighted blue
set -g pane-active-border-style "fg=${thm_blue}"


# ===========================================================
# WINDOW STATUS STYLES
# ===========================================================

# Reset activity and default window styles
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"


# ===========================================================
# ACTIVE WINDOW FORMAT
# ===========================================================

# Shows: index + checkmark + last 2 directories of current pane path
set -g window-status-current-format \
"#[fg=${thm_blue},bg=${thm_bg}] #I: \
#[fg=${thm_magenta},bg=${thm_bg}](✓) \
#[fg=${thm_cyan},bg=${thm_bg}]#(echo '#{pane_current_path}' | rev | cut -d'/' -f-2 | rev) \
#[fg=${thm_magenta},bg=${thm_bg}]"


# ===========================================================
# INACTIVE WINDOW FORMAT
# ===========================================================

# Shows: index + window name
set -g window-status-format \
"#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_fg},bg=${thm_bg}]#W"


# ===========================================================
# STATUS RIGHT
# ===========================================================

# Shows: window name | prefix indicator | session name
set -g status-right \
"#[fg=${thm_blue},bg=${thm_bg}]\
#[fg=${thm_bg},bg=${thm_blue}] \
#[fg=${thm_fg},bg=${thm_gray}] #W \
#{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]\
#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] \
#[fg=${thm_fg},bg=${thm_gray}] #S "


# ===========================================================
# STATUS LEFT
# ===========================================================

# Minimal — keep it clean
set -g status-left ""


# ===========================================================
# MODE STYLES
# ===========================================================

# Clock mode color
set -g clock-mode-colour "${thm_blue}"

# Copy/choice mode highlight style
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"
